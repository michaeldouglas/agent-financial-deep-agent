services:
  agent-financial:
    build:
      context: ./agent-financial
      dockerfile: Dockerfile
    command:
      - uv
      - run
      - --locked
      - uvicorn
      - --app-dir
      - /workspace
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /workspace
      - app:app
    env_file:
      - ./agent-financial/.env
    volumes:
      - ./agent-financial/app.py:/workspace/app.py
      - ./agent-financial/src:/workspace/src
      - ./agent-financial/skills:/workspace/skills
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  frontend-financial:
    build:
      context: ./frontend-financial
      dockerfile: Dockerfile
    depends_on:
      agent-financial:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend-financial:/app
      - frontend_node_modules:/app/node_modules
      - /app/.next
  mcp-financial:
    build:
      context: ./mcp-financial
      dockerfile: Dockerfile
    environment:
      MCP_ADDR: :8081
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8081/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  frontend_node_modules:
